<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <title>{{ title or "ADB Upgrade Bot" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f7f7f9; }
      .container-narrow { max-width: 1100px; }
      .text-monospace { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .card { border-radius: 1rem; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container container-narrow">
        <a class="navbar-brand fw-bold" href="/">ADB Upgrade Bot</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link{{ ' active' if active=='overview' else '' }}" href="/">Overview</a></li>
            <li class="nav-item"><a class="nav-link{{ ' active' if active=='manage' else '' }}" href="/manage-devices">Manage</a></li>
            <li class="nav-item"><a class="nav-link{{ ' active' if active=='summary' else '' }}" href="/summary">Summary</a></li>
            <li class="nav-item"><a class="nav-link{{ ' active' if active=='legacy' else '' }}" href="/legacy">Legacy Config</a></li>
            <li class="nav-item"><a class="nav-link{{ ' active' if active=='config' else '' }}" href="/config">Config</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container container-narrow my-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
