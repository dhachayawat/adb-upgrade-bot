{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h3 class="m-0">Devices — Overview</h3>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-primary btn-sm" href="/manage-devices">Manage Devices</a>
    <a class="btn btn-outline-secondary btn-sm" href="/summary">Summary (7d)</a>
    <button class="btn btn-outline-secondary btn-sm" onclick="refresh()">Refresh</button>
  </div>
</div>

<div id="cards" class="row gy-3"></div>

<script>
async function api(path, opt){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opt||{}));
  return r.json();
}

async function load(){
  const data = await api('/api/devices');
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  data.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'col-12 col-lg-6';
    el.innerHTML = cardHtml(d);
    cards.appendChild(el);
  });
}

function cardHtml(d){
  const badge = stateBadge(d.state);
  const hist = histogramHtml(d.break_histogram || {});
  const href = '/devices/' + encodeURIComponent(d.id);
  return `
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="d-flex align-items-center gap-2">
            <h5 class="card-title mb-0"><a href="${href}" class="text-decoration-none">${escapeHtml(d.name)}</a></h5>
            <a href="${href}" class="badge text-bg-secondary text-decoration-none">${escapeHtml(d.id)}</a>
          </div>
          <div class="text-muted small">${escapeHtml(d.device)}</div>
        </div>
        <div>${badge}</div>
      </div>

      <div class="row mt-3 g-2">
        <div class="col-4">
          <div class="small text-muted">Uptime</div>
          <div class="fw-bold">${d.uptime_min?.toFixed ? d.uptime_min.toFixed(2) : d.uptime_min} min</div>
        </div>
        <div class="col-4">
          <div class="small text-muted">Items Done</div>
          <div class="fw-bold">${d.items_upgraded_done || 0}</div>
        </div>
        <div class="col-4">
          <div class="small text-muted">Target</div>
          <div class="d-flex flex-column gap-2">
            <div class="d-flex align-items-center gap-2">
              <input type="number" min="1" max="10" class="form-control form-control-sm w-50"
                    id="tl-${escapeId(d.id)}" value="${d.target_level || 5}">
              <button class="btn btn-sm btn-outline-primary"
                      onclick="setTarget('${encodeURIComponent(d.id)}', false)">Apply</button>
            </div>
            <div>
              <button class="btn btn-sm btn-primary w-100"
                      onclick="setTarget('${encodeURIComponent(d.id)}', true)"
                      title="Apply & Save to config">Apply+Save</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <div class="small text-muted">Breaks by Level (today)</div>
        ${hist}
      </div>

      <div class="mt-3 d-flex gap-2">
        ${controlButtons(d)}
        <a class="btn btn-outline-secondary btn-sm" href="${href}">Open</a>
      </div>
    </div>
  </div>`;
}

function controlButtons(d){
  let btns = [];
  if(d.state==='idle' || d.state==='error'){
    btns.push(`<button class="btn btn-success btn-sm" onclick="act('${encodeURIComponent(d.id)}','start')">Start</button>`);
    btns.push(`<button class="btn btn-outline-danger btn-sm" onclick="act('${encodeURIComponent(d.id)}','stop')">Stop</button>`);
  }
  if(d.state==='running'){
    btns.push(`<button class="btn btn-warning btn-sm" onclick="act('${encodeURIComponent(d.id)}','pause')">Pause</button>`);
    btns.push(`<button class="btn btn-danger btn-sm" onclick="act('${encodeURIComponent(d.id)}','stop')">Stop</button>`);
  }
  if(d.state==='paused'){
    btns.push(`<button class="btn btn-warning btn-sm" onclick="act('${encodeURIComponent(d.id)}','resume')">Resume</button>`);
    btns.push(`<button class="btn btn-danger btn-sm" onclick="act('${encodeURIComponent(d.id)}','stop')">Stop</button>`);
  }
  return btns.join(' ');
}

function stateBadge(s){
  const map = { running:'success', paused:'warning', idle:'secondary', error:'danger', stopping:'secondary' };
  const cls = map[s] || 'secondary';
  return `<span class="badge text-bg-${cls} text-uppercase">${s}</span>`;
}

function histogramHtml(h){
  const keys = Object.keys(h).sort((a,b)=>parseInt(a)-parseInt(b));
  if(keys.length===0) return '<div class="text-muted small">No breaks</div>';
  const pills = keys.map(k=>`<span class="badge text-bg-dark me-1">+${k}: ${h[k]}</span>`);
  return `<div>${pills.join(' ')}</div>`;
}

async function act(id, cmd){
  await api(`/api/devices/${id}/${cmd}`, {method:'POST'});
  refresh();
}

async function setTarget(id, persist){
  const input = document.getElementById(`tl-${decodeURIComponent(id)}`);
  const v = parseInt(input.value, 10);
  if(isNaN(v)) return;
  await api(`/api/devices/${id}/target-level`, {method:'PUT', body: JSON.stringify({target_level: v, persist: !!persist})});
  refresh();
}

function escapeHtml(s){
  return (''+s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeId(s){
  // ใช้ใน element id: กันอักขระพิเศษ
  return (''+s).replace(/[^A-Za-z0-9\-_:.]/g,'_');
}

async function refresh(){ await load(); }
document.addEventListener('DOMContentLoaded', load);
</script>
{% endblock %}
