{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <a href="/devices/{{ device_id }}" class="btn btn-link p-0">&larr; Back</a>
    <h3 class="m-0 mt-2">Edit Device</h3>
    <div class="text-muted small">แก้ไขข้อมูลอุปกรณ์ แล้วกด Save</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary btn-sm" href="/manage-devices">Manage</a>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-12 col-md-3">
        <label class="form-label small">ID</label>
        <input id="f-id" class="form-control form-control-sm" readonly value="{{ device_id }}">
        <div class="form-text">แก้ ID ไม่ได้</div>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label small">Name</label>
        <input id="f-name" class="form-control form-control-sm" placeholder="BlueStack-1">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label small">Device (host:port หรือ usb:SERIAL)</label>
        <input id="f-device" class="form-control form-control-sm" placeholder="host.docker.internal:5565">
      </div>
      <div class="col-12 col-md-1">
        <label class="form-label small">Target +N</label>
        <input id="f-target" type="number" min="1" max="10" class="form-control form-control-sm" value="5">
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary btn-sm" onclick="save()">Save</button>
      <a class="btn btn-outline-secondary btn-sm" href="/devices/{{ device_id }}">Cancel</a>
      <button class="btn btn-outline-danger btn-sm ms-auto" onclick="del()">Delete</button>
    </div>
  </div>
</div>

<script>
const DEV_ID = "{{ device_id }}";

async function api(path, opt){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opt||{}));
  if(r.headers.get('content-type')?.includes('application/json')) return r.json();
  return r.text();
}

function fill(d){
  document.getElementById('f-name').value   = d.name || '';
  document.getElementById('f-device').value = d.device || '';
  document.getElementById('f-target').value = d.target_level ?? 5;
}

async function load(){
  // ใช้ /status เพื่อเติมข้อมูล (มี name/device/target/state)
  const j = await api(`/api/devices/${encodeURIComponent(DEV_ID)}/status`);
  if(j && !j.error) fill(j);
}

async function save(){
  const body = {
    id: DEV_ID,
    name: (document.getElementById('f-name').value || '').trim(),
    device: (document.getElementById('f-device').value || '').trim(),
    target_level: parseInt(document.getElementById('f-target').value, 10) || 5
  };
  if(!body.name || !body.device){ alert('กรอก Name และ Device ให้ครบ'); return; }
  const r = await api('/api/devices', {method:'POST', body: JSON.stringify(body)});
  if(r.error){ alert(r.error); return; }
  location.href = `/devices/${encodeURIComponent(DEV_ID)}`;
}

async function del(){
  if(!confirm(`ลบอุปกรณ์ ${DEV_ID} ?`)) return;
  const r = await api(`/api/devices/${encodeURIComponent(DEV_ID)}`, {method:'DELETE'});
  if(r.error){ alert(r.error); return; }
  location.href = '/manage-devices';
}

document.addEventListener('DOMContentLoaded', load);
</script>
{% endblock %}
